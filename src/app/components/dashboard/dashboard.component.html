<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>

  <div class="d-flex min-vh-100">
    <aside class="bg-light border-end d-none d-md-block" style="width: 240px; min-height: 100vh;">
      <div class="p-3">
        <h5 class="mb-3">Academia</h5>
        <nav class="nav flex-column">
          <a class="nav-link" routerLink="/dashboard/empresas" routerLinkActive="active"
            *ngIf="authService.role === 'editor'">Empresas</a>
          <a class="nav-link" routerLink="/dashboard/categorias" routerLinkActive="active"
            *ngIf="authService.role === 'editor'">Categorías</a>
          <a class="nav-link" routerLink="/dashboard/tests" routerLinkActive="active"
            *ngIf="authService.role === 'editor'">Tests</a>
          <a class="nav-link" routerLink="/dashboard/logros" routerLinkActive="active"
            *ngIf="authService.role === 'editor'">Logros</a>
        </nav>
        <div class="mt-4">
          <span class="badge bg-secondary">{{ authService.role || 'usuario' }}</span>
        </div>
        <div class="mt-3">
          <button class="btn btn-outline-danger btn-sm" (click)="logout()">Cerrar sesión</button>
        </div>
      </div>
    </aside>

    <div class="flex-grow-1 p-4">

      <nav class="navbar navbar-light bg-white mb-4 rounded px-3 shadow-sm d-md-none">
        <div class="d-flex w-100 justify-content-between align-items-center">
          <span class="navbar-brand">Academia</span>
          <button type="button" class="btn btn-outline-danger btn-sm" (click)="logout()">Salir</button>
        </div>
      </nav>

      <router-outlet></router-outlet>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
