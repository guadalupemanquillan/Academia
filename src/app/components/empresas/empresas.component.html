<div class="card shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="card-title mb-0">Empresas</h5>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrearEmpresa">Nueva Empresa</button>
    </div>
    <div class="mb-3">
      <input type="text" class="form-control" placeholder="Buscar por nombre" [(ngModel)]="empresasFiltro">
    </div>
    <div class="table-responsive">
      <table class="table table-striped table-sm">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Imagen</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of empresasFiltradas">
            <td>{{ e.nombre }}</td>
            <td>
              <img *ngIf="e.imagen" [src]="e.imagen" alt="imagen" style="height:32px">
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-secondary me-1" data-bs-toggle="modal" data-bs-target="#modalVerEmpresa" (click)="verEmpresa(e)">Ver</button>
              <button class="btn btn-sm btn-outline-primary me-1" data-bs-toggle="modal" data-bs-target="#modalEditarEmpresa" (click)="abrirEditarEmpresa(e)">Editar</button>
              <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#modalEliminarEmpresa" (click)="confirmarEliminarEmpresa(e)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="modalCrearEmpresa" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crear Empresa</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="crearEmpresaCerrarBtn"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="nuevaEmpresa.nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Imagen (URL)</label>
          <input class="form-control" [(ngModel)]="nuevaEmpresa.imagen">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="crearEmpresa()">Crear</button>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="modalVerEmpresa" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Detalle Empresa</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" *ngIf="empresaSeleccionada as emp">
        <p class="mb-1"><strong>Nombre:</strong> {{ emp.nombre }}</p>
        <div *ngIf="emp.imagen">
          <img [src]="emp.imagen" alt="imagen" style="height:48px">
        </div>
      </div>
    </div>
  </div>
 </div>
<div class="modal fade" id="modalEditarEmpresa" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Empresa</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="editarEmpresaCerrarBtn"></button>
      </div>
      <div class="modal-body" *ngIf="empresaEditar as emp">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="emp.nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Imagen (URL)</label>
          <input class="form-control" [(ngModel)]="emp.imagen">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardarEdicionEmpresa()">Guardar</button>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="modalEliminarEmpresa" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Eliminar Empresa</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="eliminarEmpresaCerrarBtn"></button>
      </div>
      <div class="modal-body">
        ¿Confirmas eliminar esta empresa?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" (click)="eliminarEmpresa()">Eliminar</button>
      </div>
    </div>
  </div>
</div>
