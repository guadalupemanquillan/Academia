<div class="card shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="card-title mb-0">Tests</h5>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrearTest">Nuevo Test</button>
    </div>
    <div class="table-responsive">
      <table class="table table-striped table-sm">
        <thead>
          <tr>
            <th> Preguntas</th>
            <th> Logros</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of tests">
            <td>{{ t.preguntas.length }}</td>
            <td>{{ t.logros?.length ?? 0 }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-1" data-bs-toggle="modal" data-bs-target="#modalEditarTest" (click)="abrirEditarTest(t)">Editar</button>
              <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#modalEliminarTest" (click)="confirmarEliminarTest(t)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="modalEditarTest" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Test</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="editarTestCerrarBtn"></button>
      </div>
      <div class="modal-body" *ngIf="testEditar as t">
        <div *ngFor="let p of t.preguntas; let i=index" class="border rounded p-3 mb-3">
          <div class="mb-2">
            <label class="form-label">Título de la pregunta</label>
            <input class="form-control" [(ngModel)]="p.tituloPregunta">
          </div>
          <div class="mb-2">
            <label class="form-label">Opciones de respuesta</label>
            <div *ngFor="let o of p.opcionesRespuesta; let j=index" class="input-group mb-1">
              <input class="form-control" [(ngModel)]="p.opcionesRespuesta[j]">
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label">Respuesta correcta</label>
            <input class="form-control" [(ngModel)]="p.respuestaCorrecta">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardarEdicionTest()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalEliminarTest" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Eliminar Test</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="eliminarTestCerrarBtn"></button>
      </div>
      <div class="modal-body">
        ¿Confirmas eliminar este test?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" (click)="eliminarTest()">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalCrearTest" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crear Test</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
          id="crearTestCerrarBtn"></button>
      </div>
      <div class="modal-body">
        <div *ngFor="let p of nuevoTest.preguntas; let i=index" class="border rounded p-3 mb-3">
          <div class="mb-2">
            <label class="form-label">Título de la pregunta</label>
            <input class="form-control" [(ngModel)]="p.tituloPregunta">
          </div>
          <div class="mb-2">
            <label class="form-label">Opciones de respuesta</label>
            <div *ngFor="let o of p.opcionesRespuesta; let j=index" class="input-group mb-1">
              <input class="form-control" [(ngModel)]="p.opcionesRespuesta[j]">
            </div>
            <button class="btn btn-sm btn-outline-secondary" (click)="agregarOpcion(i)">Agregar opción</button>
          </div>
          <div class="mb-2">
            <label class="form-label">Respuesta correcta</label>
            <input class="form-control" [(ngModel)]="p.respuestaCorrecta">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="crearTest()">Crear</button>
      </div>
    </div>
  </div>
</div>
