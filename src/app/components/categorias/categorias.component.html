<div class="card shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="card-title mb-0">Categorías</h5>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCrearCategoria">Nueva
        Categoría</button>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-8">
        <input type="text" class="form-control" placeholder="Buscar por nombre" [(ngModel)]="categoriasNombreFiltro">
      </div>
      <div class="col-4 d-grid">
        <button class="btn btn-outline-secondary" (click)="cargarCategorias()">Buscar</button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-striped table-sm">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Padre</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of categoriasResp?.items">
            <td>{{ c.nombre }}</td>
            <td>{{ categoriaNombrePorId(c.categoriaPadre) }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-1" data-bs-toggle="modal" data-bs-target="#modalEditarCategoria" (click)="abrirEditarCategoria(c)">Editar</button>
              <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#modalEliminarCategoria" (click)="confirmarEliminarCategoria(c)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <nav *ngIf="categoriasResp" class="d-flex justify-content-between align-items-center">
      <span>Pagina {{ categoriasResp.page }} / {{ categoriasResp.totalPages }}</span>
      <div class="btn-group">
        <button class="btn btn-outline-secondary" (click)="cambiarPaginaCategorias(categoriasResp.page - 1)"
          [disabled]="categoriasResp.page <= 1">Anterior</button>
        <button class="btn btn-outline-secondary" (click)="cambiarPaginaCategorias(categoriasResp.page + 1)"
          [disabled]="categoriasResp.page >= categoriasResp.totalPages">Siguiente</button>
      </div>
    </nav>
  </div>
</div>
<div class="modal fade" id="modalEditarCategoria" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Categoría</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="editarCategoriaCerrarBtn"></button>
      </div>
      <div class="modal-body" *ngIf="categoriaEditar as c">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="c.nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Categoría Padre (ID)</label>
          <input class="form-control" [(ngModel)]="c.categoriaPadre">
        </div>
        <div class="mb-3">
          <label class="form-label">Jerarquía</label>
          <input type="number" class="form-control" [(ngModel)]="c.jerarquia">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardarEdicionCategoria()">Guardar</button>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="modalEliminarCategoria" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Eliminar Categoría</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="eliminarCategoriaCerrarBtn"></button>
      </div>
      <div class="modal-body">
        ¿Confirmas eliminar esta categoría?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" (click)="eliminarCategoria()">Eliminar</button>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="modalCrearCategoria" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crear Categoría</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
          id="crearCategoriaCerrarBtn"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" [(ngModel)]="nuevaCategoria.nombre">
        </div>
        <div class="mb-3">
          <label class="form-label">Categoría Padre (ID)</label>
          <input class="form-control" [(ngModel)]="nuevaCategoria.categoriaPadre">
        </div>
        <div class="mb-3">
          <label class="form-label">Jerarquía</label>
          <input type="number" class="form-control" [(ngModel)]="nuevaCategoria.jerarquia">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="crearCategoria()">Crear</button>
      </div>
    </div>
  </div>
</div>
